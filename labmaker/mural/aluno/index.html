<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mural dos Alunos | LabMaker</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#edf6ff;color:#09224a;min-height:100vh;display:flex;flex-direction:column}header,footer{background:linear-gradient(110deg,#092a50,#0759a8);color:white;padding:16px 22px}.wrap{max-width:1240px;margin:auto;width:100%;padding:20px}header .wrap,footer .wrap{padding:0}header b{font-size:22px}header em{color:#55baff;font-style:normal}main{flex:1}.hero{background:linear-gradient(110deg,#e7f5ff,#fff);border-radius:16px;padding:18px;margin-bottom:14px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#52627a}.lanes{display:flex;gap:14px;overflow-x:auto;padding:10px 0 20px}.lane{min-width:280px;width:280px;background:#e0ebf8;border-radius:14px;padding:12px}.lane h2{margin:4px 0 12px;font-size:19px}.post{background:#fff;padding:13px;border-radius:12px;margin-bottom:10px;border:1px solid #cad9ec;overflow:hidden}.post p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.post img{max-width:100%}.btn{border:0;border-radius:9px;padding:11px 14px;background:#087cff;color:white;font-weight:800;cursor:pointer}.card{background:#fff;border:1px solid #d6e4f6;padding:18px;border-radius:14px;max-width:500px;margin:auto}label{font-size:13px;font-weight:800;display:block;margin:12px 0 5px}input,textarea{width:100%;font:inherit;border:1px solid #bacbe0;border-radius:9px;padding:10px}textarea{min-height:115px}.muted{font-size:13px;color:#52627a}.error{color:#b42318}.art{height:160px;position:relative;overflow:hidden;background:#f6f9ff}.art div{position:absolute;padding:4px;overflow:hidden}footer{font-size:12px}dialog{border:0;border-radius:16px;padding:20px;width:min(500px,95vw)}dialog::backdrop{background:#001c3e99}.hide{display:none!important}@media(max-width:600px){.wrap{padding:14px}.lane{min-width:245px;width:245px}}</style></head><body><header><div class="wrap"><b>AnnA <em>One</em></b> · LabMaker Mural <span style="float:right">🎓 Espaço dos alunos</span></div></header><main class="wrap"><div class="hero"><h1 id="title">Mural Colaborativo</h1><p id="description">Carregando atividade...</p></div><p class="muted" id="status" role="status"></p><div id="lanes" class="lanes"></div></main><footer><div class="wrap">AnnA One · Tecnologia e Educação Juntas · © 2026 Elison Borges · Todos os direitos reservados.</div></footer><dialog id="dialog"><h2>Adicionar cartão</h2><p class="muted">Identifique sua equipe. Não informe dados pessoais sensíveis.</p><label>Nome da equipe</label><input id="name" maxlength="70" placeholder="Ex.: Mesa 1 — Equipe Sol"><label>Título</label><input id="cardTitle" maxlength="120"><label>Texto</label><textarea id="body" maxlength="3500"></textarea><p><button class="btn" id="save">Publicar cartão</button> <button class="btn" style="background:#52627a" onclick="document.getElementById('dialog').close()">Cancelar</button></p><p id="sendStatus" class="muted"></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const $=id=>document.getElementById(id),s=supabase.createClient(LM_CONFIG.url,LM_CONFIG.key,{auth:{persistSession:false,autoRefreshToken:false}}),token=new URLSearchParams(location.search).get('m');let selected=null;
function e(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[x]))}
function safe(v){try{return new URL(v).protocol==='https:'}catch{return false}}
function art(x){if(!Array.isArray(x))return '';return '<div class="art">'+x.slice(0,30).map(o=>{const t=['text','circle','rectangle','triangle','image'].includes(o.type)?o.type:'text',color=/^#[0-9a-f]{6}$/i.test(o.color)?o.color:'#ffbd36',style='left:'+Math.max(0,Number(o.x)||0)*.4+'px;top:'+Math.max(0,Number(o.y)||0)*.4+'px;width:'+Math.max(20,Number(o.w)||100)*.4+'px;height:'+Math.max(20,Number(o.h)||70)*.4+'px;'+(t==='circle'?'border-radius:50%;':'')+(t==='triangle'?'clip-path:polygon(50% 0,0 100%,100% 100%);':'')+(t!=='text'&&t!=='image'?'background:'+color:'');return '<div style="'+style+'">'+(t==='text'?e(o.value):t==='image'&&safe(o.value)?'<img alt="" style="max-width:100%" src="'+e(o.value)+'">':'')+'</div>'}).join('')+'</div>'}
async function load(){if(!token||!/^[a-f0-9-]{36}$/i.test(token)){$('status').textContent='Link inválido. Solicite o endereço ao professor.';return}const r=await s.rpc('lm_student_board',{p_token:token});if(r.error||!r.data){$('status').textContent='Mural indisponível ou compartilhamento não ativado.';return}const m=r.data;$('title').textContent=m.title;$('description').textContent=m.description||'Participe com sua equipe.';$('status').textContent='Não é necessário fazer login. Escolha sua mesa para publicar.';$('lanes').innerHTML=(m.sections||[]).map(sec=>'<section class="lane"><h2>'+e(sec.title)+'</h2><button class="btn" data-section="'+e(sec.id)+'">+ Adicionar cartão</button>'+(sec.cards||[]).map(c=>'<article class="post"><small>'+e(c.author_label)+'</small><h3>'+e(c.title)+'</h3>'+(c.layout==='free'?art(c.elements):'<p>'+e(c.body)+'</p>'+(safe(c.image_url)?'<img alt="Imagem do cartão" src="'+e(c.image_url)+'">':''))+'</article>').join('')+'</section>').join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{selected=b.dataset.section;$('sendStatus').textContent='';$('dialog').showModal()})}
$('save').onclick=async()=>{const name=$('name').value.trim(),title=$('cardTitle').value.trim(),body=$('body').value;if(name.length<2||!title)return $('sendStatus').textContent='Informe a equipe e o título.';$('save').disabled=true;const r=await s.rpc('lm_student_post',{p_token:token,p_section:selected,p_name:name,p_title:title,p_body:body,p_elements:[],p_layout:'organized'});$('save').disabled=false;if(r.error)return $('sendStatus').textContent='Não foi possível publicar. '+r.error.message;$('dialog').close();$('cardTitle').value='';$('body').value='';await load()};load();setInterval(load,15000);
</script></body></html>
