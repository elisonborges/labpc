<style>
:root{--ink:#17324d;--card:#fff;--blue:#1769e0;--green:#15945f;--shadow:0 10px 28px #17324d18}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf4ff,#f7fbff 42%,#f4f7fb);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}header{min-height:62px;padding:10px 18px;background:#123b68;color:#fff;display:flex;align-items:center;gap:14px;justify-content:space-between;box-shadow:0 3px 12px #0002}header b{font-size:20px}header .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:#ffffff20;padding:7px 11px;border-radius:999px;font-weight:800}button{font:inherit;border:0;border-radius:12px;padding:10px 14px;font-weight:850;cursor:pointer;color:var(--ink);background:#e7eef7;box-shadow:0 2px 5px #0001}button.primary{background:var(--blue);color:#fff}button.good{background:var(--green);color:#fff}button.danger{background:#ffe0e0;color:#8a2020}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1180px;margin:auto;padding:18px}.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}.hero{text-align:center;margin-bottom:14px}.hero h1{margin:0 0 4px;font-size:clamp(25px,4vw,38px)}.hero p{margin:0;color:#49657f;font-weight:650}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mission{min-height:150px;text-align:left;border:3px solid transparent;position:relative}.mission.open{border-color:#b9d3ff}.mission.done{border-color:#8ad8b7;background:#f2fff8}.mission.locked{opacity:.58}.mission h3{margin:8px 0 4px}.mission .icon{font-size:30px}.dots{display:flex;gap:6px;margin-top:14px}.dot{width:13px;height:13px;border-radius:50%;background:#d9e2ec}.dot.done{background:var(--green)}.dot.current{background:var(--blue)}.lock{position:absolute;right:12px;top:12px}.question{font-size:clamp(21px,3vw,31px);font-weight:950;text-align:center;background:#fff7d9;border:3px solid #f2c14e;border-radius:16px;padding:13px 16px;margin-bottom:14px}.stage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}.activity{min-height:360px;background:#f8fbff;border:2px solid #dce8f5;border-radius:16px;padding:16px}.nexo{position:sticky;top:12px;text-align:center}.robot{font-size:70px;line-height:1}.bubble{background:#fff;border:3px solid #8db9ef;border-radius:18px;padding:13px;margin-top:8px;font-weight:800;box-shadow:var(--shadow)}.kicker{text-align:center;font-size:14px;font-weight:900;letter-spacing:.08em;color:#54708a;margin:3px 0 12px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0}.choice{min-width:100px;background:#fff;border:2px solid #b9cee3;font-size:18px}.sequence{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;margin:26px 0}.token{background:#fff;border:2px solid #c6d8ea;border-radius:12px;padding:12px 15px;font-size:20px;font-weight:900}.board{display:grid;gap:5px;justify-content:center;margin:18px auto}.cell{width:58px;height:58px;background:#fff;border:2px solid #bfd2e6;border-radius:11px;display:grid;place-items:center;font-size:27px}.cell.target{background:#fff4be}.cell.nexoCell{background:#dcecff}.program{max-width:440px;margin:16px auto;background:#eef4fb;border:2px solid #c9d9e8;border-radius:15px;padding:12px}.repeat{background:#7b56d8;color:#fff;border-radius:12px;padding:12px;font-weight:900}.inside{margin:9px 0 0 22px;background:#fff;color:var(--ink);border-radius:9px;padding:9px}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}.feedback{margin:14px auto 0;max-width:700px;border-radius:14px;padding:12px;text-align:center;font-weight:850}.feedback.ok{background:#e7fff2;border:2px solid #8ad8b7}.feedback.try{background:#fff2df;border:2px solid #f2bf70}.answer-label{text-align:center;margin:14px 0 4px;font-size:16px;font-weight:950;letter-spacing:.05em;color:#355a7d}.big-action{font-size:46px;text-align:center;margin:20px}.mini{color:#587189;font-size:14px}.levelnav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.levelnav h2{margin:0;font-size:18px}.teacher{background:#eef5ff;border:2px dashed #8eb5e8;border-radius:14px;padding:12px;margin-top:14px}footer{text-align:center;color:#60758a;padding:16px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stage{grid-template-columns:1fr}.nexo{position:static;display:grid;grid-template-columns:80px 1fr;align-items:center}.robot{font-size:56px}.bubble{text-align:left}}@media(max-width:480px){main{padding:10px}.grid{grid-template-columns:1fr}.activity{padding:10px}.cell{width:46px;height:46px}.question{font-size:21px}}

"#2ae0ef"/><stop offset=".5" stop-color="#087cff"/><stop offset="1" stop-color="#0746e8"/></linearGradient></defs><path d="M71 13Q80-1 89 14L151 128Q157 142 142 145H119Q109 145 103 134L80 89L57 134Q51 145 40 145H17Q2 143 9 129Z" fill="url(#a)"/><path d="M22 112Q55 83 90 100Q71 90 54 108Q40 123 32 139H16Q9 139 11 131Z" fill="#061c72"/><path d="M14 129Q37 93 65 103Q78 107 84 117Q63 107 51 128Q41 145 25 145H15Q5 144 14 129Z" fill="#24c5f7"/></svg><span class="ua-brand-copy"><strong>AnnA <em>One</em></strong><small>TECNOLOGIA E EDUCAÇÃO JUNTAS</small></span></a><a class="ua-back" href="../../aprender/index.html">← Atividades do 2º ano</a></header><header><b>🔁 LabPC · Missão Repetição</b><div class="right"><span class="pill" id="progress">0/32 níveis</span><button id="homeBtn">🗺️ Missões</button><button id="centralBtn">🏠 Atividades</button></div></header><main id="app"></main><script>
const MISSIONS=[["🔁","DE NOVO!"],["🔎","O QUE SE REPETE?"],["🔢","QUANTAS VEZES?"],["💡","CONHEÇA O REPITA"],["🤖","ENSINE O NEXO"],["🐞","CUIDADO COM O REPITA"],["🧩","MAIS DE UMA AÇÃO"],["🏆","MESTRE DAS REPETIÇÕES"]];
const LEVELS=[
{q:"QUANTAS PALMAS VOCÊ VIU?",type:"choice",seq:["👏","👏","👏"],opts:["2","3","4"],ans:"3",nexo:"Observe primeiro. Depois conte.",h:["Veja cada palma.","Conte uma por uma.","Há três palmas."]},
{q:"O QUE NEXO REPETIU?",type:"choice",seq:["🤖⬆️","🤖⬆️","🤖⬆️"],opts:["PULAR","GIRAR","BATER PALMAS"],ans:"PULAR",nexo:"Veja o movimento que acontece de novo.",h:["Observe as setas.","O movimento vai para cima.","Nexo está pulando."]},
{q:"QUANTAS VEZES A LUZ PISCOU?",type:"choice",seq:["💡","⚫","💡","⚫","💡"],opts:["2","3","5"],ans:"3",nexo:"Conte apenas quando a luz aparece acesa.",h:["Ignore os círculos apagados.","Conte as lâmpadas.","A luz acende três vezes."]},
{q:"FAÇA COMO O NEXO: BATA PALMAS 4 VEZES.",type:"confirm",seq:["👏","👏","👏","👏"],nexo:"Agora é com você!",h:["Faça a ação com seu corpo.","Conte enquanto bate palmas.","Depois marque que concluiu."]},
{q:"O QUE ESTÁ SE REPETINDO?",type:"choice",seq:["👏","👏","👏","👏"],opts:["👏","👣","🙌"],ans:"👏",nexo:"Procure o que aparece de novo.",h:["Compare os símbolos.","Todos são iguais.","A palma se repete."]},
{q:"QUAL ELEMENTO QUEBROU A REPETIÇÃO?",type:"choice",seq:["⭐","⭐","❤️","⭐"],opts:["⭐","❤️","🔵"],ans:"❤️",nexo:"Um deles é diferente.",h:["Compare cada posição.","Procure o símbolo que aparece só uma vez.","É o coração."]},
{q:"QUAL GRUPO ESTÁ SE REPETINDO?",type:"choice",seq:["👏 👣","👏 👣","👏 👣"],opts:["👏","👣","👏 👣"],ans:"👏 👣",nexo:"Desta vez, duas ações andam juntas.",h:["Separe a sequência em grupos.","O mesmo par aparece três vezes.","Palma e passos formam o grupo."]},
{q:"QUAL SÍMBOLO COMPLETA O PADRÃO?",type:"choice",seq:["⬆️","➡️","⬆️","➡️","⬆️","❓"],opts:["⬆️","➡️","⬇️"],ans:"➡️",nexo:"Descubra o par que volta a aparecer.",h:["Veja os dois primeiros símbolos.","O padrão é cima, direita.","Depois de cima vem direita."]},
{q:"ONDE NEXO VAI PARAR?",type:"boardPredict",steps:2,nexo:"Preveja antes de executar.",h:["Nexo vai avançar duas casas.","Conte duas casas à frente.","Marque a segunda casa."]},
{q:"QUANTAS VEZES PULAR APARECE?",type:"choice",seq:["PULAR","PULAR","PULAR"],opts:["2","3","4"],ans:"3",nexo:"Conte os comandos iguais.",h:["Leia um comando de cada vez.","Todos dizem PULAR.","São três comandos."]},
{q:"QUANTAS VEZES AVANCE APARECE?",type:"choice",seq:["AVANCE","AVANCE","AVANCE","AVANCE","AVANCE"],opts:["3","4","5"],ans:"5",nexo:"Conte sem pressa.",h:["Marque cada AVANCE mentalmente.","Há cinco blocos.","A resposta é 5."]},
{q:"ONDE NEXO VAI PARAR?",type:"boardPredict",steps:4,nexo:"Faça sua previsão. Depois teste.",h:["Cada AVANCE muda uma casa.","Conte quatro casas.","Marque a quarta casa."]},
{q:"OS DOIS PROGRAMAS LEVAM NEXO AO MESMO LUGAR?",type:"compare",nexo:"Observe os dois jeitos de dar o comando.",h:["Conte os AVANCE do Programa A.","Veja o número do REPITA.","Os dois fazem quatro avanços."]},
{q:"O QUE SIGNIFICA O NÚMERO 3?",type:"choice",seq:["🔁 REPITA 3 VEZES","↳ PULAR"],opts:["PULAR 1 VEZ","PULAR 3 VEZES","IR PARA A CASA 3"],ans:"PULAR 3 VEZES",nexo:"O número diz quantas vezes a ação acontece.",h:["Olhe para a palavra VEZES.","O comando interno é PULAR.","PULAR acontecerá três vezes."]},
{q:"COMPLETE O REPITA.",type:"repeatNumber",count:5,nexo:"Transforme cinco AVANCE em uma repetição.",h:["Conte quantos AVANCE existem.","O número do REPITA deve ser igual.","Use 5."]},
{q:"ONDE NEXO VAI PARAR?",type:"repeatPredict",count:4,nexo:"Agora você já conhece o REPITA.",h:["AVANCE está dentro do REPITA.","Ele acontece quatro vezes.","Conte quatro casas."]},
{q:"QUANTAS VEZES NEXO DEVE AVANÇAR?",type:"repeatNumber",count:3,nexo:"Conte as casas até a estrela.",h:["Há três movimentos até o objetivo.","O número controla a repetição.","Use 3."]},
{q:"QUAL AÇÃO DEVE FICAR DENTRO DO REPITA?",type:"choice",seq:["🔁 REPITA 4 VEZES","↳ ❓"],opts:["AVANCE","PULAR","VIRE"],ans:"AVANCE",nexo:"O objetivo está em linha reta.",h:["Veja o caminho.","Nexo precisa seguir em frente.","Escolha AVANCE."]},
{q:"MONTE O COMANDO PARA CHEGAR À ESTRELA.",type:"build",count:4,nexo:"Escolha a quantidade e a ação.",h:["Conte as casas.","O caminho é reto.","REPITA 4 VEZES → AVANCE."]},
{q:"PROGRAME NEXO PARA CHEGAR AO OBJETIVO.",type:"build",count:5,nexo:"Planeje antes de executar.",h:["Conte a distância.","Use uma repetição.","Cinco avanços resolvem este caminho."]},
{q:"O QUE PRECISA SER CORRIGIDO?",type:"debug",goal:3,bad:5,kind:"QUANTIDADE",nexo:"Passei da estrela. Vamos investigar?",h:["Compare o destino com o resultado.","A ação está certa.","Mude a quantidade para 3."]},
{q:"O QUE PRECISA SER CORRIGIDO?",type:"debugAction",nexo:"A quantidade está certa. E a ação?",h:["O objetivo está em frente.","GIRAR não aproxima Nexo.","Troque por AVANCE."]},
{q:"O QUE ESTÁ FALTANDO NO PROGRAMA?",type:"choice",seq:["🔁 REPITA ❓ VEZES","↳ AVANCE"],opts:["UMA COR","UMA QUANTIDADE","OUTRO NEXO"],ans:"UMA QUANTIDADE",nexo:"O computador precisa saber quantas vezes.",h:["Leia o bloco REPITA.","Há um espaço no número.","Falta a quantidade."]},
{q:"ENCONTRE O PROBLEMA.",type:"debugRandom",nexo:"Execute, observe e corrija.",h:["Veja se ação e quantidade combinam com o objetivo.","Há apenas um problema.","Corrija e teste novamente."]},
{q:"QUAL GRUPO ESTÁ SE REPETINDO?",type:"choice",seq:["AVANCE · PULE","AVANCE · PULE","AVANCE · PULE"],opts:["AVANCE","PULE","AVANCE · PULE"],ans:"AVANCE · PULE",nexo:"Uma repetição pode guardar mais de uma ação.",h:["Separe em pares.","O mesmo par aparece três vezes.","AVANCE e PULE formam o grupo."]},
{q:"O QUE ACONTECE DUAS VEZES?",type:"choice",seq:["🔁 REPITA 2 VEZES","↳ AVANCE","↳ VIRE À DIREITA"],opts:["SÓ AVANCE","SÓ VIRE","AVANCE E VIRE"],ans:"AVANCE E VIRE",nexo:"Veja quais comandos estão dentro do REPITA.",h:["Observe o recuo dos comandos.","Os dois estão dentro do bloco.","AVANCE e VIRE se repetem."]},
{q:"QUAL TRECHO DEVE ENTRAR NO REPITA?",type:"selectRepeat",nexo:"Nem todo comando precisa se repetir.",h:["Procure os comandos iguais.","PEGUE A ESTRELA acontece só no final.","Os três AVANCE entram no REPITA."]},
{q:"CONSTRUA UM PERCURSO COM REPETIÇÃO.",type:"groupBuild",nexo:"Repita um pequeno grupo de ações.",h:["Use AVANCE e VIRE juntos.","O grupo pode acontecer duas vezes.","Monte REPITA 2 → AVANCE + VIRE."]},
{q:"O QUE PRECISA SE REPETIR?",type:"choice",seq:["🤖 □ □ □ ⭐"],opts:["AVANCE","VIRE","PEGUE"],ans:"AVANCE",nexo:"Planeje antes de programar.",h:["Observe a direção do objetivo.","Não há curva.","AVANCE é a ação repetida."]},
{q:"OS DOIS PROGRAMAS PODEM FUNCIONAR?",type:"compare",nexo:"Duas soluções diferentes podem chegar ao mesmo resultado.",h:["Conte os avanços do Programa A.","Compare com o REPITA.","Os dois representam quatro avanços."]},
{q:"RESOLVA O DESAFIO SURPRESA.",type:"debugRandom",nexo:"Observe, planeje, teste e ajuste.",h:["Primeiro descubra o objetivo.","Depois confira ação e quantidade.","Há um único ajuste necessário."]},
{q:"LEVE NEXO ATÉ A BATERIA USANDO REPETIÇÃO.",type:"final",nexo:"Agora a solução é sua!",h:["Conte a distância até a bateria.","Use REPITA.","Escolha AVANCE e a quantidade correta."]}];
let state=JSON.parse(localStorage.getItem("labpc_repeticao_v1")||'{"unlocked":1,"done":[],"teacher":false}');let current=null,hint=0,predicted=null;const app=document.getElementById("app"),prog=document.getElementById("progress");
function save(){localStorage.setItem("labpc_repeticao_v1",JSON.stringify(state));updateProgress()}function updateProgress(){prog.textContent=`${state.done.length}/32 níveis${state.teacher?" · Professor":""}`}function missionIndex(level){return Math.floor((level-1)/4)}
function showMap(){current=null;predicted=null;hint=0;let cards=MISSIONS.map((m,i)=>{const start=i*4+1,unlocked=state.teacher||state.unlocked>=start,completed=[0,1,2,3].every(x=>state.done.includes(start+x));const dots=[0,1,2,3].map(x=>`<span class="dot ${state.done.includes(start+x)?'done':(state.unlocked===start+x?'current':'')}"></span>`).join("");return `<button class="card mission ${unlocked?'open':'locked'} ${completed?'done':''}" ${unlocked?`onclick="openLevel(${Math.min(Math.max(start,state.unlocked>=start?start:state.unlocked),start+3)})"`:"disabled"}><span class="icon">${m[0]}</span>${unlocked?"":'<span class="lock">🔒</span>'}<h3>${i+1}. ${m[1]}</h3><div class="mini">4 níveis</div><div class="dots">${dots}</div></button>`}).join("");app.innerHTML=`<section class="card hero"><h1>🔁 Missão Repetição</h1><p>Descubra como fazer ações acontecerem de novo.</p></section><section class="grid">${cards}</section><section class="teacher"><b>👨‍🏫 Área do professor</b><div class="controls"><button onclick="toggleTeacher()">${state.teacher?'🔒 Sair do Modo Professor':'🔓 Modo Professor'}</button><button class="danger" onclick="resetActivity()">🔄 Reiniciar atividade</button></div></section>`;updateProgress()}
function toggleTeacher(){state.teacher=!state.teacher;save();showMap()}function resetActivity(){if(confirm("Reiniciar todo o progresso da Missão Repetição?")){state={unlocked:1,done:[],teacher:false};save();showMap()}}function openLevel(n){if(!state.teacher&&n>state.unlocked)return;current=n;hint=0;predicted=null;renderLevel()}
function navHeader(l){const mi=missionIndex(current),within=((current-1)%4)+1;return `<div class="levelnav"><h2>${MISSIONS[mi][0]} Missão ${mi+1} — ${MISSIONS[mi][1]} · Nível ${within}/4</h2><button onclick="showMap()">🗺️ Missões</button></div><div class="question">${l.q}</div>`}
function nexo(l){return `<aside class="nexo"><div class="robot">🤖</div><div class="bubble" id="bubble">${l.nexo}</div><div class="controls"><button onclick="giveHint()">💡 Dica</button></div></aside>`}function renderLevel(){const l=LEVELS[current-1];app.innerHTML=`${navHeader(l)}<section class="stage"><div class="activity">${renderActivity(l)}</div>${nexo(l)}</section>`}function answerLabel(){return `<div class="answer-label">✏️ RESPONDA AQUI</div>`}
function renderActivity(l){const seq=l.seq?`<div class="sequence">${l.seq.map(x=>`<span class="token">${x}</span>`).join("")}</div>`:"";if(l.type==="choice")return `<div class="kicker">👀 OBSERVE</div>${seq}${answerLabel()}<div class="choices">${l.opts.map(o=>`<button class="choice" onclick='answerChoice(${JSON.stringify(o)},${JSON.stringify(l.ans)})'>${o}</button>`).join("")}</div><div id="feedback"></div>`;if(l.type==="confirm")return `<div class="kicker">🙌 FAÇA</div>${seq}${answerLabel()}<div class="big-action">👏 👏 👏 👏</div><div class="controls"><button class="good" onclick="complete()">✓ FIZ 4 VEZES</button></div><div id="feedback"></div>`;if(l.type==="boardPredict")return boardPredict(l.steps,false);if(l.type==="repeatPredict")return boardPredict(l.count,true);
if(l.type==="compare")return `<div class="kicker">🔮 PREVEJA</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="program"><b>PROGRAMA A</b><div class="inside">➡️ AVANCE<br>➡️ AVANCE<br>➡️ AVANCE<br>➡️ AVANCE</div></div><div class="program"><b>PROGRAMA B</b><div class="repeat">🔁 REPITA 4 VEZES<div class="inside">➡️ AVANCE</div></div></div></div>${answerLabel()}<div class="choices"><button class="choice" onclick="compareAnswer(true)">SIM</button><button class="choice" onclick="compareAnswer(false)">NÃO</button></div><div id="feedback"></div>`;
if(l.type==="repeatNumber")return `<div class="kicker">🧩 COMPLETE</div><div class="board">${boardHTML(l.count)}</div>${answerLabel()}<div class="program"><div class="repeat">🔁 REPITA <select id="num"><option>?</option>${[2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select> VEZES<div class="inside">➡️ AVANCE</div></div></div><div class="controls"><button class="primary" onclick="checkNumber(${l.count})">▶ EXECUTAR</button></div><div id="feedback"></div>`;
if(l.type==="build")return `<div class="kicker">🧱 PROGRAME</div><div class="board">${boardHTML(l.count)}</div>${answerLabel()}<div class="program"><div class="repeat">🔁 REPITA <select id="num"><option>?</option>${[2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select> VEZES<div class="inside"><select id="act"><option>?</option><option>AVANCE</option><option>PULE</option><option>VIRE</option></select></div></div></div><div class="controls"><button class="primary" onclick="checkBuild(${l.count})">▶ EXECUTAR</button></div><div id="feedback"></div>`;
if(l.type==="debug")return `<div class="kicker">🐞 INVESTIGUE</div><div class="board">${boardHTML(l.goal)}</div>${answerLabel()}<div class="program"><div class="repeat">🔁 REPITA <select id="num"><option>${l.bad}</option>${[2,3,4,5].filter(n=>n!==l.bad).map(n=>`<option>${n}</option>`).join("")}</select> VEZES<div class="inside">➡️ AVANCE</div></div></div><div class="controls"><button class="primary" onclick="checkNumber(${l.goal})">🔧 CORRIGIR E TESTAR</button></div><div id="feedback"></div>`;
if(l.type==="debugAction")return `<div class="kicker">🐞 INVESTIGUE</div><div class="board">${boardHTML(4)}</div>${answerLabel()}<div class="program"><div class="repeat">🔁 REPITA 4 VEZES<div class="inside"><select id="act"><option>VIRE</option><option>AVANCE</option><option>PULE</option></select></div></div></div><div class="controls"><button class="primary" onclick="checkAction()">🔧 CORRIGIR E TESTAR</button></div><div id="feedback"></div>`;if(l.type==="debugRandom"){const goal=current===31?4:3,bad=goal+1;return `<div class="kicker">🔎 EXECUTE · OBSERVE · CORRIJA</div><div class="board">${boardHTML(goal)}</div>${answerLabel()}<div class="program"><div class="repeat">🔁 REPITA <select id="num"><option>${bad}</option>${[2,3,4,5].filter(n=>n!==bad).map(n=>`<option>${n}</option>`).join("")}</select> VEZES<div class="inside">➡️ AVANCE</div></div></div><div class="controls"><button class="primary" onclick="checkNumber(${goal})">▶ TESTAR NOVAMENTE</button></div><div id="feedback"></div>`;}

function boardHTML(steps,target="⭐"){let cells=`<div class="cell nexoCell">🤖</div>`;for(let i=1;i<=steps;i++)cells+=`<div class="cell ${i===steps?'target':''}">${i===steps?target:""}</div>`;return `<div style="grid-template-columns:repeat(${steps+1},58px)" class="board">${cells}</div>`}
function boardPredict(steps,rep){return `<div class="kicker">🔮 PREVEJA</div>${answerLabel()}<div class="board" style="grid-template-columns:repeat(${steps+2},58px)">${[0,...Array(steps+1).keys()].map((_,i)=>`<button class="cell ${i===0?'nexoCell':''} ${i===steps?'target':''}" onclick="setPrediction(${i})">${i===0?'🤖':(i===steps?'⭐':'')}</button>`).join("")}</div>${rep?`<div class="program"><div class="repeat">🔁 REPITA ${steps} VEZES<div class="inside">➡️ AVANCE</div></div></div>`:`<div class="sequence">${Array(steps).fill('<span class="token">AVANCE</span>').join("")}</div>`}<div class="controls"><button class="primary" onclick="executePrediction(${steps})">▶ EXECUTAR</button></div><div id="feedback"></div>`}
function setPrediction(i){predicted=i;document.querySelectorAll(".cell").forEach((x,j)=>x.style.outline=j===i?"4px solid #1769e0":"")}function executePrediction(goal){if(predicted===null)return feedback("Faça sua previsão primeiro.","try");if(predicted===goal){feedback("Sua previsão combinou com o resultado!","ok");completeSoon()}else feedback("Foi diferente. Compare sua previsão com o resultado e tente novamente.","try")}function answerChoice(v,a){if(v===a){feedback("Isso! Boa investigação.","ok");completeSoon()}else feedback("Ainda não. Observe novamente.","try")}function compareAnswer(v){if(v){feedback("Isso! Os dois programas fazem quatro avanços.","ok");completeSoon()}else feedback("Teste de novo: conte quantos AVANCE cada programa representa.","try")}function checkNumber(goal){const n=Number(document.getElementById("num").value);if(n===goal){feedback("Funcionou! Nexo chegou ao objetivo.","ok");completeSoon()}else feedback(n>goal?"Nexo passou do objetivo. O que você mudaria?":"Nexo ainda não chegou. O que você mudaria?","try")}function checkBuild(goal){const n=Number(document.getElementById("num").value),a=document.getElementById("act").value;if(n===goal&&a==="AVANCE"){feedback("Programa funcionando!","ok");completeSoon()}else feedback("O resultado foi diferente. Confira a ação e a quantidade.","try")}function checkAction(){if(document.getElementById("act").value==="AVANCE"){feedback("Isso! A quantidade estava certa; a ação precisava mudar.","ok");completeSoon()}else feedback("Essa ação ainda não leva Nexo até a estrela.","try")}function checkSelection(){const c=[...document.querySelectorAll('#selectProg input')].filter(x=>x.checked).map(x=>Number(x.value));if(JSON.stringify(c)===JSON.stringify([0,1,2])){feedback("Isso! Os AVANCE se repetem. PEGUE A ESTRELA fica fora.","ok");completeSoon()}else feedback("Observe quais comandos realmente acontecem várias vezes.","try")}function checkGroup(){const n=Number(document.getElementById("num").value),a1=document.getElementById("a1").value,a2=document.getElementById("a2").value;if(n===2&&a1==="AVANCE"&&a2==="VIRE"){feedback("Você repetiu um grupo de duas ações!","ok");completeSoon()}else feedback("Tente repetir duas vezes o grupo AVANCE + VIRE.","try")}function checkFinal(){const n=Number(document.getElementById("num").value),a=document.getElementById("act").value;if(n===5&&a==="AVANCE"){feedback("🏆 Missão concluída! Conquista desbloqueada: MESTRE DAS REPETIÇÕES.","ok");complete(true)}else feedback("Ainda não chegamos à bateria. Observe, ajuste e teste novamente.","try")}function feedback(t,k){const f=document.getElementById("feedback");if(f){f.className="feedback "+k;f.textContent=t}}function giveHint(){const l=LEVELS[current-1];hint=Math.min(hint+1,l.h.length);document.getElementById("bubble").textContent="💡 "+l.h[hint-1]}function completeSoon(){setTimeout(()=>complete(false),650)}function complete(final=false){if(!state.done.includes(current))state.done.push(current);if(!state.teacher)state.unlocked=Math.max(state.unlocked,Math.min(32,current+1));save();if(final||current===32){app.innerHTML=`<section class="card hero"><div style="font-size:70px">🏆</div><h1>MISSÃO REPETIÇÃO CONCLUÍDA!</h1><h2>🔁 MESTRE DAS REPETIÇÕES</h2><p>🤖 “Agora você sabe quando alguma coisa precisa acontecer de novo!”</p><p><b>Pequenos passos, grandes descobertas.</b></p><div class="controls"><button class="primary" onclick="showMap()">🗺️ VOLTAR ÀS MISSÕES</button></div></section>`;return}openLevel(current+1)}document.getElementById("homeBtn").onclick=showMap;document.getElementById("centralBtn").onclick=()=>location.href="../../aprender/index.html";updateProgress();showMap();</script><footer class="ua-footer"><p><strong>AnnA One · Universo Aprender · 2º ano</strong></p><p>Idealização e desenvolvimento: Prof. Elison Borges · © 2026 Elison Borges</p></footer></body></html>
