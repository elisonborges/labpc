<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar entrega</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#092747}header{background:#061a2e;color:#fff;padding:15px 22px}header div{max-width:800px;margin:auto;display:flex;justify-content:space-between}header a{color:#d7e9f7;text-decoration:none}.wrap{max-width:720px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:16px;padding:22px;margin-bottom:14px}h1{margin-top:0}label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #bfd0df;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer;background:#1474b8;color:#fff;width:100%;margin-top:12px}.muted{color:#61738a;font-size:13px;line-height:1.5}.error{color:#b42318;font-size:13px;font-weight:700;margin-top:10px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#fff1d8;color:#76520a;font-size:11px;font-weight:900}.feedback{background:#fff8e8;border-left:4px solid #d59b21;padding:14px;border-radius:8px;white-space:pre-wrap;line-height:1.5}.meta{line-height:1.7;font-size:14px}.version{border-top:1px solid #edf1f5;padding:9px 0;font-size:13px}.resubmit{margin-top:18px;padding:16px;background:#f4f9fd;border:1px solid #cfe0ef;border-radius:12px}.success{color:#087b61;font-weight:800;margin-top:10px}#result{display:none}</style></head><body><header><div><strong>📚 Projetos Escolares</strong><a href="../index.html">← Voltar</a></div></header><main class="wrap"><section class="card" id="form"><h1>🔎 Consultar entrega</h1><p class="muted">Digite os dados do comprovante para acompanhar a análise do professor.</p><label>Protocolo</label><input id="protocol" placeholder="EP-20261006-XXXXXX"><label>Código de acesso</label><input id="code" placeholder="8 caracteres" maxlength="8"><button class="btn" id="go">Consultar</button><div id="err" class="error"></div></section><section class="card" id="result"><div id="content"></div><button class="btn" id="again">Consultar outra entrega</button></section></main><script>
const BASE='https://wdlmfjxyuwgdiyukmpir.supabase.co/functions/v1/',U=BASE+'student-submission-status',q=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),L={awaiting_review:'Aguardando análise',under_review:'Em análise',changes_requested:'Correção solicitada',resubmitted:'Reenviado',approved:'Aprovado',published:'Publicado'};
q('go').onclick=async()=>{q('err').textContent='';let p=q('protocol').value.trim().toUpperCase(),a=q('code').value.trim().toUpperCase();if(!p||a.length!==8){q('err').textContent='Informe protocolo e código de 8 caracteres.';return}q('go').disabled=true;try{let r=await fetch(U,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({protocol:p,access_code:a})}),x=await r.json();if(!r.ok)throw Error(x.error||'Falha na consulta.');let s=x.submission,c=s.class||{},m=(s.members||[]).map(x=>x.first_name).join(', '),f=s.latest_review?.feedback||'';q('content').innerHTML='<h2>'+e(s.title)+' <span class="status">'+e(L[s.status]||s.status)+'</span></h2><div class="meta"><b>'+e(s.protocol)+'</b><br>'+e(s.project?.name||'')+'<br>'+e(c.units?.name||'')+' · '+e(c.shift||'')+' · '+e(c.grade||'')+' · Turma '+e(c.class_name||'')+'<br><b>Integrantes:</b> '+e(m)+'<br><b>Versão atual:</b> '+s.current_version+'</div>'+(s.status==='changes_requested'&&f?'<h3>✏️ Orientação do professor</h3><div class="feedback">'+e(f)+'</div><p class="muted">Faça as alterações solicitadas e envie o PDF corrigido abaixo.</p><div class="resubmit"><b>📤 Enviar nova versão</b><label>Novo arquivo PDF</label><input id="newPdf" type="file" accept="application/pdf,.pdf"><button class="btn" id="sendV" onclick="sendVersion()">Enviar nova versão</button><div id="sendMsg" class="error"></div></div>':'')+'<h3>Histórico de arquivos</h3>'+(s.versions||[]).map(v=>'<div class="version"><b>Versão '+v.version_number+'</b> · '+e(v.original_filename)+'</div>').join('');q('form').style.display='none';q('result').style.display='block'}catch(x){q('err').textContent=x.message}finally{q('go').disabled=false}};
async function sendVersion(){const file=q('newPdf').files[0],msg=q('sendMsg'),btn=q('sendV');msg.className='error';msg.textContent='';if(!file||file.type!=='application/pdf'||!file.name.toLowerCase().endsWith('.pdf')){msg.textContent='Selecione um arquivo PDF válido.';return}btn.disabled=true;try{const auth={protocol:q('protocol').value.trim().toUpperCase(),access_code:q('code').value.trim().toUpperCase()};btn.textContent='Preparando...';let r=await fetch(BASE+'student-resubmit-start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...auth,filename:file.name,file_size:file.size})}),x=await r.json();if(!r.ok)throw Error(x.error);btn.textContent='Enviando PDF...';const client=supabase.createClient('https://wdlmfjxyuwgdiyukmpir.supabase.co','sb_publishable_F2HfP-vkw7rLYSP-5oPTzQ_XMe_9O86');const up=await client.storage.from('project-submissions').uploadToSignedUrl(x.path,x.token,file,{contentType:'application/pdf'});if(up.error)throw Error('O PDF não pôde ser enviado.');btn.textContent='Confirmando...';r=await fetch(BASE+'student-resubmit-finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...auth,path:x.path,filename:file.name,file_size:file.size,version:x.version})});let y=await r.json();if(!r.ok)throw Error(y.error);msg.className='success';msg.textContent='Versão '+y.version+' enviada com sucesso!';setTimeout(()=>q('go').click(),800)}catch(err){msg.textContent=err.message||'Falha no envio.';btn.disabled=false;btn.textContent='Tentar novamente'}}
q('again').onclick=()=>{q('result').style.display='none';q('form').style.display='block'};['protocol','code'].forEach(id=>q(id).addEventListener('keydown',x=>{if(x.key==='Enter')q('go').click()}));
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><footer style="text-align:center;padding:18px;color:#8090a3;font:12px Arial,sans-serif">© 2026 Elison Borges · Todos os direitos reservados</footer></body></html>
