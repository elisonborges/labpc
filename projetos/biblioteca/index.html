<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Digital — Projetos Escolares</title><style>*{box-sizing:border-box}:root{--nav:#102b4e;--blue:#1769aa;--ink:#17304d;--muted:#687d93;--line:#dbe5ef;--bg:#f4f7fb}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:#fff;padding:12px 20px}.bar{max-width:1120px;margin:auto;display:flex;justify-content:space-between}.bar a{color:#d9efff;text-decoration:none;font-weight:750}.wrap{max-width:1120px;margin:18px auto;padding:0 18px}.hero h1{font-size:30px;margin:0 0 5px}.hero p{color:var(--muted);margin:0}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:14px 0}input,select{width:100%;border:1px solid #cbd8e5;border-radius:9px;padding:10px;font:inherit}.summary{font-size:12px;color:var(--muted);margin:8px 2px 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;min-height:180px}.bookIcon{font-size:28px}.book h2{font-size:18px;margin:8px 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.55;flex:1}.tag{display:inline-block;background:#e8f6f1;color:#147d64;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;margin-top:6px}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer;margin-top:12px}.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}footer{text-align:center;padding:24px;color:#8090a3;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="bar"><strong>📚 Biblioteca Digital</strong><a href="../index.html">← Projetos Escolares</a></div></header><main class="wrap"><section class="hero"><h1>E-books publicados</h1><p>Conheça produções selecionadas e publicadas pelos professores nos Projetos Escolares.</p></section><div class="filters"><input id="search" placeholder="Buscar pelo título..." oninput="render()"><select id="project" onchange="render()"><option value="">Todos os projetos</option></select><select id="classFilter" onchange="render()"><option value="">Todas as turmas</option></select></div><div id="summary" class="summary">Carregando Biblioteca...</div><section id="books" class="grid"><div class="empty">Carregando e-books publicados...</div></section></main><footer>Projetos Escolares · © 2026 Elison Borges · Todos os direitos reservados</footer><script>const BASE='https://wdlmfjxyuwgdiyukmpir.supabase.co/functions/v1/',KEY='sb_publishable_F2HfP-vkw7rLYSP-5oPTzQ_XMe_9O86';let items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cl(x){return x.unit+' · '+x.shift+' · '+x.grade+' · Turma '+x.class_name}async function load(){try{const r=await fetch(BASE+'public-library-list',{headers:{apikey:KEY}}),x=await r.json();if(!r.ok)throw Error(x.error);items=x.items||[];const ps=[...new Set(items.map(x=>x.project))].sort(),cs=[...new Set(items.map(cl))].sort();project.innerHTML='<option value="">Todos os projetos</option>'+ps.map(x=>'<option>'+esc(x)+'</option>').join('');classFilter.innerHTML='<option value="">Todas as turmas</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join('');render()}catch(e){summary.textContent='';books.innerHTML='<div class="empty">Não foi possível carregar a Biblioteca Digital agora.</div>'}}function render(){const q=search.value.trim().toLowerCase(),p=project.value,c=classFilter.value,rows=items.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(!p||x.project===p)&&(!c||cl(x)===c));summary.textContent=rows.length+' e-book'+(rows.length===1?' publicado':'s publicados');books.innerHTML=rows.length?rows.map(x=>'<article class="book"><div class="bookIcon">📘</div><h2>'+esc(x.title)+'</h2><div class="meta"><b>'+esc(x.project)+'</b><br>'+esc(cl(x))+'<br><span class="tag">PUBLICADO</span></div><button class="btn" onclick="openBook(\''+x.id+'\',this)">📖 Ler e-book</button></article>').join(''):'<div class="empty">Nenhum e-book encontrado com estes filtros.</div>'}async function openBook(id,b){const old=b.textContent;b.disabled=true;b.textContent='Abrindo...';try{const r=await fetch(BASE+'public-library-pdf',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({id})}),x=await r.json();if(!r.ok)throw Error(x.error);window.open(x.url,'_blank','noopener')}catch(e){alert(e.message||'Não foi possível abrir o e-book.')}finally{b.disabled=false;b.textContent=old}}load();</script></body></html>
