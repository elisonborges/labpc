<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor Digital — Projetos Escolares</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17202b;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}header{height:52px;background:#102b4e;display:flex;align-items:center;padding:0 18px}.bar{width:100%;max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar a,.tool{color:#dceeff;text-decoration:none;font-weight:800}.stage{min-height:calc(100vh - 110px);display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}#book{filter:drop-shadow(0 14px 24px #0008)}.page{background:#fff;overflow:hidden}.page canvas{width:100%;height:100%;display:block}.loading{text-align:center;color:#d7e1eb}.controls{min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;background:#101820;padding:8px;position:sticky;bottom:0}.tool{border:1px solid #ffffff30;background:#ffffff12;border-radius:9px;padding:8px 12px;cursor:pointer}.tool:hover{background:#ffffff20}.count{min-width:92px;text-align:center;font-size:13px;color:#d7e1eb}.original{font-size:12px}.error{background:#fff;color:#7b2630;border-radius:14px;padding:24px;max-width:520px;text-align:center}@media(max-width:600px){header{height:auto;padding:10px}.bar{align-items:flex-start}.original{display:none}.stage{padding:8px;min-height:calc(100vh - 116px)}.tool{padding:8px 10px}}</style></head><body>
<header><div class="bar"><a href="../index.html">← Biblioteca</a><strong id="title">📖 Leitor Digital</strong><a id="original" class="original" target="_blank" rel="noopener">Abrir PDF original ↗</a></div></header>
<main class="stage"><div id="loading" class="loading">Preparando as páginas do e-book...</div><div id="book"></div></main>
<div class="controls"><button class="tool" onclick="prev()">← Anterior</button><span id="count" class="count">—</span><button class="tool" onclick="next()">Próxima →</button><button class="tool" onclick="full()">⛶ Tela cheia</button></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const BASE='https://wdlmfjxyuwgdiyukmpir.supabase.co/functions/v1/',KEY='sb_publishable_F2HfP-vkw7rLYSP-5oPTzQ_XMe_9O86',id=new URLSearchParams(location.search).get('id');let pf=null,total=0;
async function init(){try{if(!id)throw Error('E-book não informado.');const r=await fetch(BASE+'public-library-pdf',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({id})}),x=await r.json();if(!r.ok)throw Error(x.error||'E-book indisponível.');document.getElementById('original').href=x.url;const pdf=await pdfjsLib.getDocument(x.url).promise;total=pdf.numPages;const pages=[];for(let n=1;n<=total;n++){document.getElementById('loading').textContent='Preparando página '+n+' de '+total+'...';const p=await pdf.getPage(n),vp=p.getViewport({scale:1.45}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const d=document.createElement('div');d.className='page';d.appendChild(canvas);pages.push(d)}document.getElementById('loading').remove();const host=document.getElementById('book');pages.forEach(p=>host.appendChild(p));pf=new St.PageFlip(host,{width:560,height:790,size:'stretch',minWidth:280,maxWidth:620,minHeight:395,maxHeight:875,showCover:true,mobileScrollSupport:false,maxShadowOpacity:.45,usePortrait:true});pf.loadFromHTML(document.querySelectorAll('.page'));pf.on('flip',e=>update(e.data));update(0)}catch(e){document.getElementById('loading').className='error';document.getElementById('loading').textContent=e.message||'Não foi possível abrir este e-book.'}}
function update(i){document.getElementById('count').textContent='Página '+(Number(i)+1)+' / '+total}window.prev=()=>pf&&pf.flipPrev();window.next=()=>pf&&pf.flipNext();window.full=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};init();
</script></body></html>
