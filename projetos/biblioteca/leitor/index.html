<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor Digital — Projetos Escolares</title>
<style>*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#17202b;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}header{height:52px;background:#102b4e;display:flex;align-items:center;padding:0 18px}.bar{width:100%;max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar a,.tool{color:#dceeff;text-decoration:none;font-weight:800}.stage{height:calc(100dvh - 110px);display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}#book{filter:drop-shadow(0 14px 24px #0008);flex:0 0 auto}.page{background:#fff;overflow:hidden}.page canvas{width:100%;height:100%;display:block}.loading{text-align:center;color:#d7e1eb}.controls{height:58px;display:flex;align-items:center;justify-content:center;gap:10px;background:#101820;padding:8px;position:sticky;bottom:0}.tool{border:1px solid #ffffff30;background:#ffffff12;border-radius:9px;padding:8px 12px;cursor:pointer}.tool:hover{background:#ffffff20}.count{min-width:92px;text-align:center;font-size:13px;color:#d7e1eb}.original{font-size:12px}.error{background:#fff;color:#7b2630;border-radius:14px;padding:24px;max-width:520px;text-align:center}@media(max-width:600px){header{height:auto;padding:10px}.bar{align-items:flex-start}.original{display:none}.stage{padding:8px;height:calc(100vh - 116px);min-height:0}.tool{padding:8px 10px}}</style></head><body>
<header><div class="bar"><a href="../index.html">← Biblioteca</a><strong id="title">📖 Leitor Digital</strong><a id="original" class="original" target="_blank" rel="noopener">Abrir PDF original ↗</a></div></header>
<main class="stage"><div id="loading" class="loading">Preparando as páginas do e-book...</div><div id="book"></div></main>
<div class="controls"><button class="tool" onclick="prev()">← Anterior</button><span id="count" class="count">—</span><button class="tool" onclick="next()">Próxima →</button><button class="tool" onclick="zoomOut()">−</button><button class="tool" onclick="fit()">Ajustar</button><span id="zoomLabel" class="count">100%</span><button class="tool" onclick="zoomIn()">+</button><button class="tool" onclick="full()">⛶ Tela cheia</button></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const BASE='https://wdlmfjxyuwgdiyukmpir.supabase.co/functions/v1/',KEY='sb_publishable_F2HfP-vkw7rLYSP-5oPTzQ_XMe_9O86',id=new URLSearchParams(location.search).get('id');
let pf=null,total=0,zoom=1,pages=[],current=0;const A4=210/297;
async function init(){try{if(!id)throw Error('E-book não informado.');const r=await fetch(BASE+'public-library-pdf',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({id})}),x=await r.json();if(!r.ok)throw Error(x.error||'E-book indisponível.');original.href=x.url;const pdf=await pdfjsLib.getDocument(x.url).promise;total=pdf.numPages;
for(let n=1;n<=total;n++){loading.textContent='Preparando página '+n+' de '+total+'...';const p=await pdf.getPage(n),vp=p.getViewport({scale:1.45}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const d=document.createElement('div');d.className='page';d.appendChild(canvas);pages.push(d)}
loading.remove();build()}catch(e){loading.className='error';loading.textContent=e.message||'Não foi possível abrir este e-book.'}}
function dims(){const stage=document.querySelector('.stage'),portrait=stage.clientWidth<760;let h=stage.clientHeight-20,w=h*A4;const maxW=(stage.clientWidth-24)/(portrait?1:2);if(w>maxW){w=maxW;h=w/A4}return{w:Math.max(180,Math.floor(w*zoom)),h:Math.max(255,Math.floor(h*zoom))}}
function build(){if(pf){try{current=pf.getCurrentPageIndex();pf.destroy()}catch(e){}pf=null}book.innerHTML='';pages.forEach(p=>book.appendChild(p));const d=dims();pf=new St.PageFlip(book,{width:d.w,height:d.h,size:'fixed',showCover:true,mobileScrollSupport:false,maxShadowOpacity:.45,usePortrait:true});pf.loadFromHTML(document.querySelectorAll('.page'));pf.on('flip',e=>{current=e.data;update()});if(current>0)pf.turnToPage(current);update()}
function update(){count.textContent='Página '+(current+1)+' / '+total;zoomLabel.textContent=Math.round(zoom*100)+'%'}
window.prev=()=>pf&&pf.flipPrev();window.next=()=>pf&&pf.flipNext();window.zoomIn=()=>{zoom=Math.min(1.4,+(zoom+.1).toFixed(1));build()};window.zoomOut=()=>{zoom=Math.max(.6,+(zoom-.1).toFixed(1));build()};window.fit=()=>{zoom=1;build()};window.full=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.();setTimeout(build,180)};window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(zoom===1)build()},180)});init();
</script></body></html>
